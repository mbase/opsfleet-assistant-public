[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opsfleet-assistant"
version = "0.1.0"
description = "Retail analytics assistant prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "google-api-core==2.43.2",
  "google-auth==2.62.0",
  "google-cloud-bigquery==3.47.0",
  "google-genai==2.33.0",
  "httpx==0.28.1",
  "langgraph==1.0.1",
  "pydantic==2.14.2",
  "requests==2.34.2",
  "rich==14.3.4",
  "sqlglot==30.27.0",
  "typer==0.21.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
privacy = ["presidio-analyzer==2.2.366"]

[project.scripts]
opsfleet = "opsfleet_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
